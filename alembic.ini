[alembic]
# Las migraciones viven adentro del paquete para viajar en el wheel; este
# `alembic.ini` es sólo para correr alembic parado en la raíz del repo.
# Un consumidor instalado con pip usa `libracommerce-migrar`, que arma el
# Config en memoria y resuelve la ruta desde `__file__`.
script_location = libracommerce/migrations
# Placeholder a propósito: el destino real llega por DATABASE_URL, que acepta
# una URL PostgreSQL o la ruta del archivo SQLite de la instancia. Ver
# libracommerce/migrations/env.py.
sqlalchemy.url = postgresql://user:password@localhost/libracommerce

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
