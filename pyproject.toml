[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "libracommerce"
# 🔴 La version se DERIVA DEL TAG, como en el resto de la familia. Antes era un
# literal y se desfaso: el tag `v0.5.0` publicaba un paquete que decia `0.4.0`,
# porque nadie toco esta linea al taguear. Lo agarro el 2026-08-10 el guard de
# CI de Contalibra y Restolibra, que compara el pin con lo instalado -- sus
# pines pedian 0.5.0 y recibian 0.4.0.
#
# Un literal esta bien solo mientras alguien se acuerde de moverlo. Derivarlo
# del tag saca la posibilidad de olvidarse.
dynamic = ["version"]
description = "Motor comercial reutilizable de la familia Libra"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest-cov>=6",
    "ruff>=0.13","pytest>=8.0",
    # SOLO PARA TESTS. Este motor no importa libracore en runtime y sigue
    # teniendo `dependencies = []` a proposito. Pero contra PostgreSQL su
    # schema se levanta con la capa de conexion de LibraCore -- que es la que
    # los productos le pasan, porque las tablas de los dos motores conviven en
    # la misma base -- y el volcado del gate sale de ahi tambien. Sin esto el
    # gate solo podria mirar SQLite, que es justo la mitad que ya funcionaba.
    #
    # v1.20.0 -> v1.37.0 (2026-08-14). **Esto NO le llega a ningun producto**:
    # es una dependencia de tests, y este motor sigue con `dependencies = []` en
    # runtime. Lo que cambia es contra que version de la capa de conexion de
    # LibraCore se levanta el schema en la suite.
    #
    # Y ese es justamente el motivo del bump: con `v1.20.0` el gate de schema
    # se estaba midiendo contra un motor que **ya no corre en ningun lado** --
    # los seis productos estan en v1.33.0 o mas arriba, y los cuatro que
    # despliegan comprobantes pasaron a v1.37.0 este mismo dia. Un banco de
    # pruebas que no se parece a produccion no prueba produccion.
    #
    # El salto toca justo la capa que estos tests usan (`db/_postgres.py`,
    # `db/clients.py`, `db/schema.py`), asi que se corrio la suite completa en
    # las dos patas --SQLite y postgres:16-- antes de subir el pin.
    #
    # v1.37.0 -> v1.38.0 (2026-08-14): las filas meta del membrete tambien se
    # recortan. La caja del valor mide ~31 mm --unos 25 caracteres a 7 pt-- y
    # `cell` no recorta: lo que se pasa se dibujaba afuera del papel. El unico
    # documento que mete texto libre ahi es el RECIBO, que pone el concepto en
    # ("Comprobante:", ref_line). Medido en la demo de VentaLibra: "Pago a
    # cuenta en cuenta corriente" terminaba en 202,2 mm en una hoja de 210.
    #
    # Es anterior a v1.37.0 y aquel arreglo no lo cubria.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.38.0",
]
offline = ["libraedge @ git+https://github.com/marianocappucci/libraedge.git@develop"]
offline-server = ["libraedge[server] @ git+https://github.com/marianocappucci/libraedge.git@develop"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Tags sin 'v' inicial en el numero de version (v0.6.0 -> 0.6.0), y un esquema
# simple para que un commit sin tag no rompa el build. Identico al de libracore
# y libraauth: los tres motores derivan igual.
local_scheme = "no-local-version"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["libracommerce"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# === lint + coverage (agregado 2026-07-31) ===
# Lint activado en los 12 repos de la familia el mismo dia. El ruleset es
# CURADO, no el default de ruff: el default tiraba entre 132 y 224 hallazgos
# por repo, casi todo estilo, y un lint que arranca en rojo se ignora desde el
# primer dia. Estas reglas dan CERO hallazgos hoy en los 12, asi que cualquier
# rojo futuro es una regresion real y no deuda vieja.
#
# F401 (import sin usar) queda AFUERA A PROPOSITO: son ~396 en la familia y
# buena parte son re-exports deliberados en __init__.py, donde el import ES la
# API publica del modulo. Sacarlos a ciegas rompe a quien importa desde ahi.
# Queda como backlog aparte, para revisar a mano archivo por archivo.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "website", "node_modules"]

[tool.ruff.lint]
select = [
    "E9",    # el archivo no parsea, o error de IO al leerlo
    "F63",   # comparaciones invalidas (`is` contra un literal, `in` mal usado)
    "F7",    # `break` / `continue` / `return` fuera de lugar
    "F811",  # redefinicion de un nombre ya definido o importado
    "F821",  # nombre no definido -> NameError seguro en runtime
    "F822",  # nombre listado en __all__ que no existe en el modulo
    "F823",  # variable local usada antes de asignarse
    "F841",  # variable asignada y nunca usada (codigo muerto)
    "F541",  # f-string sin placeholders (suele ser llaves olvidadas)
    "F502", "F506", "F522", "F524",  # %/format() con argumentos mal armados
    "F601", "F602",                  # `x in 1, 2` en vez de `x in (1, 2)`
]

[tool.coverage.run]
source = ["libracommerce"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/.venv/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Piso de cobertura. Es un TRINQUETE, no una meta: se fijo 2 puntos por
# debajo de lo que el repo media el 2026-07-31 (91%), asi que hoy pasa
# holgado y lo unico que puede ponerlo en rojo es una regresion. Cuando la
# cobertura suba de verdad, subir tambien este numero -- nunca bajarlo para
# que pase un cambio.
fail_under = 89
