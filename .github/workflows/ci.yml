name: CI

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # libraedge (dependencia privada del extra offline-server, agregada
      # cuando la sync se migro ahi) es inalcanzable con el GITHUB_TOKEN
      # por defecto. LIBRA_PAT es un PAT fine-grained con acceso de
      # lectura a libraedge -- mismo patron que ventalibra/gestiolibra/medlibra.
      - name: Configure git for private Libra dependencies
        run: git config --global url."https://${{ secrets.LIBRA_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Install package + dev deps
        run: pip install -e ".[dev,offline-server]"

      - name: Run tests
        run: pytest -v
